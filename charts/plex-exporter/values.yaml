replicaCount: 1

image:
  repository: ghcr.io/axsuul/plex-media-server-exporter
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# env vars passed directly to the container
env: {}
# PLEX_SERVER: http://plex.plex:32400

# name of an existing Secret whose keys are injected as env vars (envFrom)
envFromSecret: ""

service:
  port: 9594

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
