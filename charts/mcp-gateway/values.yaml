replicaCount: 1

image:
  repository: ghcr.io/mikkoparkkola/mcp-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 39400

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: cloudflare-issuer
  hosts:
    - host: mcp-gateway.gnorplabs.cc
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-gateway-certificate
      hosts:
        - mcp-gateway.gnorplabs.cc

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Probes are deliberately PROCESS-ONLY (a TCP connect to the listener).
#
# They must not use the gateway's /health endpoint. /health aggregates backend
# health and answers 503 as soon as ANY backend is unhealthy, so a
# backend-aware liveness probe turns one sick backend into a full gateway
# outage: the kubelet kills a perfectly healthy gateway, and with
# replicaCount: 1 and strategy: Recreate that is a total outage plus a cold
# tool cache on every restart (the gateway's tool warm-start is one-shot, so
# a backend that is not up yet stays at 0 tools).
#
# The gateway already isolates a failing backend on its own: the failsafe
# circuit breaker opens after failure_threshold failures, and the remaining
# backends keep serving. Backend health belongs in the
# mcp_gateway_circuit_breaker_state Prometheus metric, not in a pod probe.
# /health stays available for humans and for load-balancer style checks.
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: false
  storageClass: "freenas-iscsi-csi"
  accessMode: ReadWriteOnce
  size: 1Gi

stdioBackends:
  enabled: false
  nodeImage: "node:22-slim"
  backends: []
  # - name: filesystem
  #   package: "@modelcontextprotocol/server-filesystem@1.0.0"
  #   command: "mcp-server-filesystem"
  #   args: []
  #   description: "Local filesystem access"
  #   env: {}

httpBackends: []
# - name: brave-search
#   image: mcp/brave-search:latest
#   port: 3000
#   path: "/mcp"           # optional, defaults to /mcp
#   description: "Brave web search"
#   env: {}
#   envFromSecrets: []
#   #   - name: BRAVE_API_KEY
#   #     secretName: brave-api-secret
#   #     secretKey: api-key
#   resources: {}

gateway:
  server:
    host: "0.0.0.0"
    port: 39400
    requestTimeout: 30s
    shutdownTimeout: 30s
  auth:
    enabled: true
    bearerToken: "auto"

  metaMcp:
    enabled: true
    cacheTools: true
    cacheTtl: 300s
    warmStart: []
  # Wait for the configured HTTP backends to accept connections before the
  # gateway process starts.
  #
  # The gateway's tool warm-start is one-shot: it prefetches every backend's
  # tool list at startup and never retries. A backend that is not listening
  # yet is therefore left permanently at 0 tools -- it still shows as running
  # and calls addressed to it by name still work, but it contributes nothing
  # to the tool index, so gateway_search_tools never returns it.
  #
  # That race is easy to hit: the agentmemory mcp-bridge sidecar needs a
  # minute or two to download supergateway and start, and the gateway
  # container starts in seconds. This initContainer closes the gap. It waits
  # only for backends that declare an http_url (a stdio backend is spawned
  # by the gateway itself and has nothing to wait for), and it always starts
  # the gateway once timeoutSeconds is up, so a backend that is simply down
  # cannot wedge the deployment.
  waitForBackends:
    enabled: true
    # Image used for the wait. It must provide a shell and either `nc`
    # (busybox/gnu netcat) or `python3`. Defaults to the gateway image.
    image: ""
    timeoutSeconds: 180
    # Per-connection timeout for the probe, in seconds.
    probeTimeoutSeconds: 2
    # Seconds between probe attempts.
    intervalSeconds: 3
  failsafe:
    circuitBreaker:
      enabled: true
      failureThreshold: 5
      successThreshold: 3
      resetTimeout: 30s
    retry:
      enabled: true
      maxAttempts: 3
      initialBackoff: 0s
      maxBackoff: 10s
      multiplier: 2.0
    rateLimit:
      enabled: true
      requestsPerSecond: 100
      burstSize: 50
    healthCheck:
      enabled: true
      interval: 30s
      timeout: 5s
  cache:
    enabled: true
    defaultTtl: 60s
    maxEntries: 10000
  capabilities:
    enabled: false
  security:
    sanitizeInput: true
    ssrfProtection: true
    toolPolicy:
      enabled: true
      defaultAction: allow
      useDefaultDeny: false
      logDenied: true
    firewall:
      enabled: true
      scanRequests: true
      scanResponses: true
      promptInjectionDetection: true
      credentialRedaction: true
  backends: {}
  env: {}
  envFromSecrets: []
