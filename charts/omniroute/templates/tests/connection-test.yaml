apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "omniroute.fullname" . }}-test-connection"
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          curl -f http://localhost:20128/api/monitoring/health
  restartPolicy: Never